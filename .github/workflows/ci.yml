name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8.0 is the declared floor (compatibility.nuxt / @nuxt/kit range); 3 and 4 track the latest releases.
        nuxt: ['3.8.0', 3, 4]
        zod: [3, 4]
    name: Nuxt ${{ matrix.nuxt }} / Zod ${{ matrix.zod }}
    env:
      FLOOR: ${{ matrix.nuxt == '3.8.0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install compatibility versions
        if: env.FLOOR != 'true'
        run: pnpm add -Dw nuxt@^${{ matrix.nuxt }} zod@^${{ matrix.zod }}
      - name: Install floor versions
        if: env.FLOOR == 'true'
        # Pin @nuxt/kit as well so the module's own newer kit cannot mask APIs missing from the floor.
        run: |
          pnpm add -Dw nuxt@${{ matrix.nuxt }} zod@^${{ matrix.zod }}
          pnpm add -w @nuxt/kit@${{ matrix.nuxt }}
      - if: env.FLOOR != 'true'
        run: pnpm dev:prepare
      - name: Prepare module (floor)
        if: env.FLOOR == 'true'
        # The playground pins Nuxt 4, which the floor kit cannot load; the test fixtures use the root Nuxt.
        run: pnpm exec nuxt-module-build build --stub && pnpm exec nuxt-module-build prepare
      - run: pnpm lint
      # Fixture configs set compatibilityDate, which the floor's types reject, so the floor skips type and package checks.
      - if: env.FLOOR != 'true'
        run: pnpm test:types
      - run: pnpm test
      - if: env.FLOOR != 'true'
        run: pnpm prepack
      - if: env.FLOOR != 'true'
        run: pnpm test:package
        env:
          SMOKE_NUXT_VERSION: ^${{ matrix.nuxt }}
          SMOKE_ZOD_VERSION: ^${{ matrix.zod }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm docs:build
