name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nuxt: [3, 4]
        zod: [3, 4]
    name: Nuxt ${{ matrix.nuxt }} / Zod ${{ matrix.zod }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install compatibility versions
        run: pnpm add -Dw nuxt@^${{ matrix.nuxt }} zod@^${{ matrix.zod }}
      - run: pnpm dev:prepare
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm test
      - run: pnpm prepack
      - run: pnpm test:package
        env:
          SMOKE_NUXT_VERSION: ^${{ matrix.nuxt }}
          SMOKE_ZOD_VERSION: ^${{ matrix.zod }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm docs:build
